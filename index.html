
<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VapeWorld | Computer World Barlekha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9' },
            dark: { 800: '#111827', 900: '#030712', 950: '#020617' }
          }
        }
      }
    }
  </script>
  <style>
    .glass { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #030712; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
  </style>
</head>
<body class="bg-dark-950 text-gray-100 font-sans min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

  <!-- Header -->
  <header class="sticky top-0 z-40 glass border-b border-gray-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 cursor-pointer" onclick="resetFilters()">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-brand-500/20">
          <i class="fa-solid font-bold text-white text-xl fa-cloud font-black"></i>
        </div>
        <div>
          <h1 class="font-black text-xl tracking-wider text-white">VAPE<span class="text-brand-500">WORLD</span></h1>
          <p class="text-[10px] text-gray-400 -mt-1 font-medium tracking-tight">Computer World Barlekha</p>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="flex-1 max-w-md hidden md:block">
        <div class="relative">
          <input type="text" id="searchInput" oninput="renderProducts()" placeholder="Search vapes, pods, flavours..." class="w-full bg-dark-900 border border-gray-800 rounded-xl py-2 pl-10 pr-4 text-sm focus:outline-none focus:border-brand-500 text-gray-200">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-500 text-xs"></i>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="toggleAdminModal()" class="px-3.5 py-1.5 rounded-xl border border-gray-700 bg-dark-900 hover:border-brand-500 text-xs font-semibold text-gray-300 transition-all flex items-center gap-2">
          <i class="fa-solid fa-user-shield text-brand-500"></i> Admin
        </button>
        <button onclick="toggleCartDrawer()" class="relative p-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm transition-all shadow-lg shadow-brand-600/30">
          <i class="fa-solid fa-cart-shopping"></i>
          <span id="cartBadge" class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[10px] font-bold rounded-full h-5 w-5 flex items-center justify-center border-2 border-dark-950">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
    <!-- Hero Banner -->
    <div class="relative rounded-2xl overflow-hidden glass p-6 md:p-10 border border-brand-500/20 bg-gradient-to-r from-dark-900 via-dark-800 to-brand-950/40">
      <div class="max-w-xl space-y-3">
        <span class="px-3 py-1 rounded-full bg-brand-500/10 text-brand-500 text-xs font-semibold border border-brand-500/20">Official Premium Outlet</span>
        <h2 class="text-2xl md:text-4xl font-extrabold text-white leading-tight">Elevate Your Vaping Experience</h2>
        <p class="text-sm text-gray-400">Authentic Devices, Premium E-Liquids & Accessories at Computer World Barlekha.</p>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div class="flex items-center gap-2 overflow-x-auto pb-2 sm:pb-0 w-full sm:w-auto" id="categoryTabs">
        <button onclick="filterCategory('All')" class="cat-btn active px-4 py-2 rounded-xl text-xs font-semibold bg-brand-600 text-white shadow-lg whitespace-nowrap">All</button>
        <button onclick="filterCategory('Pods')" class="cat-btn px-4 py-2 rounded-xl text-xs font-semibold bg-dark-900 text-gray-400 hover:text-white border border-gray-800 whitespace-nowrap">Pods</button>
        <button onclick="filterCategory('Disposables')" class="cat-btn px-4 py-2 rounded-xl text-xs font-semibold bg-dark-900 text-gray-400 hover:text-white border border-gray-800 whitespace-nowrap">Disposables</button>
        <button onclick="filterCategory('E-Liquids')" class="cat-btn px-4 py-2 rounded-xl text-xs font-semibold bg-dark-900 text-gray-400 hover:text-white border border-gray-800 whitespace-nowrap">E-Liquids</button>
        <button onclick="filterCategory('Coils')" class="cat-btn px-4 py-2 rounded-xl text-xs font-semibold bg-dark-900 text-gray-400 hover:text-white border border-gray-800 whitespace-nowrap">Coils</button>
      </div>
      <select id="sortSelect" onchange="renderProducts()" class="bg-dark-900 border border-gray-800 rounded-xl px-3 py-2 text-xs text-gray-300 focus:outline-none focus:border-brand-500">
        <option value="default">Default Sort</option>
        <option value="low-high">Price: Low to High</option>
        <option value="high-low">Price: High to Low</option>
      </select>
    </div>

    <!-- Product Grid -->
    <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>
  </main>

  <!-- Admin Modal -->
  <div id="adminModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-dark-900 border border-gray-800 rounded-2xl w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-gray-800 flex justify-between items-center">
        <h3 class="font-bold text-white flex items-center gap-2"><i class="fa-solid fa-user-shield text-brand-500"></i> Admin Panel</h3>
        <button onclick="toggleAdminModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <!-- Login View -->
      <div id="adminLoginView" class="p-6 space-y-4 text-center">
        <p class="text-sm text-gray-400">Enter Admin Password to manage products</p>
        <input type="password" id="adminPassword" placeholder="Password" class="w-full bg-dark-950 border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-center text-white focus:outline-none focus:border-brand-500">
        <button onclick="loginAdmin()" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-xl text-sm transition-all">Unlock Panel</button>
      </div>

      <!-- Dashboard View -->
      <div id="adminDashView" class="p-6 overflow-y-auto space-y-6 hidden">
        <form id="addProductForm" onsubmit="handleProductAdd(event)" class="space-y-4 bg-dark-950 p-4 rounded-xl border border-gray-800">
          <h4 class="text-sm font-semibold text-brand-500">Add New Product</h4>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <input type="text" id="pName" placeholder="Product Name" required class="bg-dark-900 border border-gray-800 rounded-lg p-2 text-xs text-white">
            <input type="number" id="pPrice" placeholder="Price (৳)" required class="bg-dark-900 border border-gray-800 rounded-lg p-2 text-xs text-white">
            <select id="pCategory" class="bg-dark-900 border border-gray-800 rounded-lg p-2 text-xs text-white">
              <option value="Pods">Pods</option>
              <option value="Disposables">Disposables</option>
              <option value="E-Liquids">E-Liquids</option>
              <option value="Coils">Coils</option>
            </select>
            <input type="file" id="pImageFile" accept="image/*" class="bg-dark-900 border border-gray-800 rounded-lg p-1.5 text-xs text-gray-400">
          </div>
          <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white py-2 rounded-lg text-xs font-semibold">Save Product</button>
        </form>

        <div class="space-y-3">
          <h4 class="text-sm font-semibold text-gray-300">Inventory Items</h4>
          <div id="adminProductList" class="space-y-2"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Cart Drawer -->
  <div id="cartDrawer" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex justify-end">
    <div class="bg-dark-900 w-full max-w-md h-full flex flex-col border-l border-gray-800">
      <div class="p-4 border-b border-gray-800 flex justify-between items-center">
        <h3 class="font-bold text-white flex items-center gap-2"><i class="fa-solid fa-cart-shopping text-brand-500"></i> Your Cart</h3>
        <button onclick="toggleCartDrawer()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

      <div class="p-4 border-t border-gray-800 bg-dark-950 space-y-3">
        <div class="flex justify-between font-bold text-white text-base">
          <span>Total:</span>
          <span id="cartTotal">৳ 0</span>
        </div>
        <button onclick="checkout()" class="w-full bg-brand-600 hover:bg-brand-700 text-white py-3 rounded-xl font-bold text-sm shadow-lg shadow-brand-600/30">Proceed to Checkout</button>
      </div>
    </div>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCtgwfL7-hlinNljx6hg_V-15RGyxzr0ac",
      authDomain: "vapezone-e218c.firebaseapp.com",
      projectId: "vapezone-e218c",
      storageBucket: "vapezone-e218c.appspot.com",
      messagingSenderId: "670187021157",
      appId: "1:670187021157:web:ea5abac9c6c3174bc6b78c"
    };

    let db;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    } catch(e) { console.log('Firebase Init Warning:', e); }

    // App State
    let products = JSON.parse(localStorage.getItem('vw_products')) || [
      { id: '1', name: 'Caliburn GK2 Pod Kit', price: 2800, category: 'Pods', image: 'https://images.unsplash.com/photo-1539185441755-769473a23570?w=400', inStock: true },
      { id: '2', name: 'Nasty Juice Grape 60ml', price: 1500, category: 'E-Liquids', image: 'https://images.unsplash.com/photo-1527661591475-527312dd65f5?w=400', inStock: true }
    ];
    let cart = [];
    let activeCategory = 'All';

    // UI Renders
    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const sort = document.getElementById('sortSelect').value;

      let filtered = products.filter(p => {
        const matchesCat = activeCategory === 'All' || p.category === activeCategory;
        const matchesSearch = p.name.toLowerCase().includes(search);
        return matchesCat && matchesSearch;
      });

      if (sort === 'low-high') filtered.sort((a,b) => a.price - b.price);
      if (sort === 'high-low') filtered.sort((a,b) => b.price - a.price);

      grid.innerHTML = filtered.map(p => `
        <div class="glass rounded-xl overflow-hidden flex flex-col border border-gray-800/80 hover:border-brand-500/50 transition-all">
          <img src="${p.image}" class="h-36 w-full object-cover bg-dark-900" alt="${p.name}">
          <div class="p-3 flex-1 flex flex-col justify-between space-y-2">
            <div>
              <span class="text-[10px] text-brand-500 font-semibold uppercase tracking-wider">${p.category}</span>
              <h4 class="text-xs font-bold text-gray-100 line-clamp-1">${p.name}</h4>
            </div>
            <div class="flex items-center justify-between pt-1">
              <span class="text-xs font-bold text-white">৳ ${p.price}</span>
              <button onclick="addToCart('${p.id}')" class="px-2.5 py-1 bg-brand-600 hover:bg-brand-700 text-white text-[11px] font-semibold rounded-lg">
                <i class="fa-solid fa-plus mr-1"></i> Add
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderAdminList() {
      const list = document.getElementById('adminProductList');
      list.innerHTML = products.map(p => `
        <div class="flex items-center justify-between p-2.5 bg-dark-900 border border-gray-800 rounded-lg">
          <div class="flex items-center gap-3">
            <img src="${p.image}" class="w-8 h-8 rounded object-cover">
            <div>
              <p class="text-xs font-semibold text-white">${p.name}</p>
              <p class="text-[10px] text-gray-400">৳ ${p.price} • ${p.category}</p>
            </div>
          </div>
          <button onclick="deleteProduct('${p.id}')" class="px-2.5 py-1 bg-red-500/10 hover:bg-red-500 text-red-500 hover:text-white rounded text-xs transition-all">
            Delete
          </button>
        </div>
      `).join('');
    }

    function saveProducts() {
      localStorage.setItem('vw_products', JSON.stringify(products));
      renderProducts();
      renderAdminList();
    }

    // Handlers
    function handleProductAdd(e) {
      e.preventDefault();
      const fileInput = document.getElementById('pImageFile');
      const file = fileInput.files[0];
      
      const pData = {
        id: Date.now().toString(),
        name: document.getElementById('pName').value,
        price: parseFloat(document.getElementById('pPrice').value),
        category: document.getElementById('pCategory').value,
        image: 'https://images.unsplash.com/photo-1539185441755-769473a23570?w=400',
        inStock: true
      };

      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          pData.image = evt.target.result;
          products.unshift(pData);
          saveProducts();
          document.getElementById('addProductForm').reset();
        };
        reader.readAsDataURL(file);
      } else {
        products.unshift(pData);
        saveProducts();
        document.getElementById('addProductForm').reset();
      }
    }

    function deleteProduct(id) {
      products = products.filter(p => p.id !== id);
      saveProducts();
    }

    function addToCart(id) {
      const p = products.find(x => x.id === id);
      if (p) {
        cart.push(p);
        updateCart();
      }
    }

    function updateCart() {
      document.getElementById('cartBadge').innerText = cart.length;
      const container = document.getElementById('cartItems');
      let total = 0;

      container.innerHTML = cart.map((item, idx) => {
        total += item.price;
        return `
          <div class="flex items-center justify-between p-2.5 bg-dark-950 border border-gray-800 rounded-lg">
            <div class="flex items-center gap-2">
              <img src="${item.image}" class="w-8 h-8 rounded object-cover">
              <div>
                <p class="text-xs font-semibold text-white">${item.name}</p>
                <p class="text-[10px] text-gray-400">৳ ${item.price}</p>
              </div>
            </div>
            <button onclick="cart.splice(${idx},1); updateCart();" class="text-xs text-gray-500 hover:text-red-400"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;
      }).join('');

      document.getElementById('cartTotal').innerText = '৳ ' + total;
    }

    function filterCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-brand-600', 'text-white');
        btn.classList.add('bg-dark-900', 'text-gray-400');
      });
      event.target.classList.add('bg-brand-600', 'text-white');
      renderProducts();
    }

    function resetFilters() {
      activeCategory = 'All';
      document.getElementById('searchInput').value = '';
      renderProducts();
    }

    function toggleAdminModal() {
      document.getElementById('adminModal').classList.toggle('hidden');
    }

    function toggleCartDrawer() {
      document.getElementById('cartDrawer').classList.toggle('hidden');
    }

    function loginAdmin() {
      if(document.getElementById('adminPassword').value === 'mazed123') {
        document.getElementById('adminLoginView').classList.add('hidden');
        document.getElementById('adminDashView').classList.remove('hidden');
        renderAdminList();
      } else {
        alert('Incorrect Password');
      }
    }

    function checkout() {
      if(!cart.length) return alert('Cart is empty!');
      alert('Order Placed Successfully via Cash on Delivery / bKash!');
      cart = [];
      updateCart();
      toggleCartDrawer();
    }

    // Init
    renderProducts();
  </script>
</body>
</html>
